name: Build Windows app

# The desktop shell is a Tauri build, so it needs Rust and the MSVC toolchain —
# neither of which belongs on a workstation. This builds it on a runner and hands
# back a single portable exe.
#
#   Agent Manager.exe, no installer. Double-click it and it starts its own
#   backend on a free port and shows the dashboard.
#
# The Kilo CLI is deliberately NOT bundled: the authenticated binary lives in
# the editor's extension folder, and kilo-bin.mjs discovers the newest one at
# runtime.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths:
      - "desktop/**"
      - "*.mjs"
      - "index.html"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Portable exe (windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Must match desktop/stage.mjs's default so the bundled node.exe is the
      # same LTS line the backend was written against.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-

      # Builds the payload (runtime files + node.exe) and the icon set. Everything
      # under payload/ and icons/ is generated, so none of it is committed.
      - name: Stage payload and icons
        working-directory: desktop
        run: node stage.mjs

      # --no-bundle is what makes the result portable: it emits the raw
      # executable instead of an MSI/NSIS installer.
      #
      # The npm CLI rather than `cargo install tauri-cli`: same tool, pinned to a
      # major, and it skips a long compile of the CLI itself.
      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle

      # --no-bundle does NOT embed `bundle.resources`: the bundler copies them
      # next to the exe, so the raw binary on its own starts, finds nothing, and
      # shows the failure page. The next step appends the payload to the exe
      # instead, which is what actually makes it a single portable file.
      - name: Append payload
        working-directory: desktop
        run: node package-exe.mjs

      - name: Collect artifact
        run: |
          $exe = "dist\AgentManager.exe"
          if (-not (Test-Path $exe)) { throw "expected $exe to exist" }
          Get-Item $exe | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AgentManager-windows-x64
          path: dist/AgentManager.exe
          if-no-files-found: error
          retention-days: 30