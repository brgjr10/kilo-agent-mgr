<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager</title>
  <link rel="icon" href="assets/logo-mark.png">
  <style>
    /* GitHub dark palette, kept for the accents — the state colours are load-bearing
       and must stay distinguishable at a glance. The surfaces are now liquid glass:
       translucent panels over an ambient bloom, so the palette reads *through* the
       glass instead of being painted on top of it. */
    :root {
      /* the liquid: what the glass refracts. --bg-deep is the unlit base. */
      --bg-deep: #05070b;
      --bg: #0a0e14;
      --card: rgba(255, 255, 255, 0.05);
      --card2: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.11);
      --row: rgba(255, 255, 255, 0.035);

      /* Fields and scrollports need more body than a panel does, or the bloom shows
         through the glyphs. */
      --inset: rgba(6, 9, 14, 0.55);
      --sticky: rgba(9, 13, 19, 0.88);

      --blue: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;

      /* dimmed variants, for badge and chip outlines */
      --blue-dim: #1f6feb44;
      --green-dim: #2ea04355;
      --yellow-dim: #9e6a0355;
      --red-dim: #f8514955;

      --text: #e6edf3;
      --muted: #8b949e;
      --banner-fg: #ffb4ae;

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

      /* refraction depth, in px, of the generated displacement map. Overridden per
         tier by the --glass-depth token; JS mints the matching SVG filter. */
      --glass-depth: 10;

      /* Composition of the four glass backdrops. A plain blur and nothing else:
         saturate() and brightness() are each an extra pass over the same pixels
         for a difference nobody can see against an already-soft bloom. */
      --glass-blur: blur(12px);

      /* Surface tints and inner highlights, as tokens rather than literals, so
         `off` can pin them back to the opaque hexes. A tint written straight into
         a rule is a tint the off tier cannot reach. */
      --glass-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.032));
      --glass-fill-head: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.035));
      --glass-fill-raised: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.045));
      --glass-fill-row: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.028));
      --glass-fill-flat: rgba(255, 255, 255, 0.06);
      --glass-fill-chrome: rgba(6, 9, 14, 0.5);
      --glass-fill-well: rgba(6, 9, 14, 0.42);
      --glass-fill-deep: rgba(6, 9, 14, 0.55);
      --glass-hairline: rgba(255, 255, 255, 0.055);
      --glass-groove: rgba(255, 255, 255, 0.07);
      --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      --glass-inset: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      --glass-inset-deep: inset 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    /* ---- the liquid ---- */
    /* The liquid — what the glass refracts, and the only thing behind the panels.
       Fixed so scrolling the board does not drag it with it.
       Grain is folded into the same layer rather than sitting on a second
       full-viewport fixed element: two of them meant the whole page composited
       twice per frame, and wide soft gradients band badly on an 8-bit panel. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"),
        radial-gradient(1100px 780px at 10% -12%, rgba(56, 139, 253, 0.26), transparent 62%),
        radial-gradient(940px 700px at 92% -4%, rgba(168, 85, 247, 0.20), transparent 64%),
        radial-gradient(880px 880px at 74% 104%, rgba(45, 212, 191, 0.15), transparent 62%),
        radial-gradient(760px 620px at 16% 96%, rgba(59, 130, 246, 0.13), transparent 66%);
      background-color: var(--bg-deep);
    }

    /* The edge does more work than the refraction. A hairline that goes bright
       where a light would catch it and dark where it would not is what sells the
       material; --glass-edge is reused verbatim by every surface below so they
       stay one material instead of a set of lookalikes. */
    :root {
      --glass-edge: inset 0 1px 0 rgba(255, 255, 255, 0.13),
        inset 0 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -1px 0 rgba(0, 0, 0, 0.28),
        0 1px 2px rgba(0, 0, 0, 0.34),
        0 10px 26px -14px rgba(0, 0, 0, 0.62);
      --glass-lift: 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Off: opaque panels, no backdrop-filter. Not just an accessibility escape
       hatch — this is the tier for machines where a filtered backdrop costs more
       than the effect is worth, and it is what `Glass` in the header falls back to. */
    html[data-glass="off"] {
      --bg: #0d1117;
      --card: #161b22;
      --card2: #1c2129;
      --border: #30363d;
      --row: #21262d;
      --inset: #0d1117;
      --sticky: #0d1117;
      --glass-blur: none;
      --glass-edge: none;
      --glass-lift: none;
      --glass-fill: #161b22;
      --glass-fill-head: #0d1117;
      --glass-fill-raised: #1c2129;
      --glass-fill-row: #161b22;
      --glass-fill-flat: #1c2129;
      --glass-fill-chrome: #0d1117;
      --glass-fill-well: #0d1117;
      --glass-fill-deep: #0d1117;
      --glass-hairline: #21262d;
      --glass-groove: #21262d;
      --glass-inner: none;
      --glass-inset: none;
      --glass-inset-deep: none;
    }

    html[data-glass="off"] body::before,
    html[data-glass="off"] body::after {
      display: none;
    }

    /* Ask for glass to be dropped: transparency this expensive is a legibility
       problem for some people, not a preference. */
    @media (prefers-reduced-transparency: reduce) {
      html:not([data-glass="full"]) {
        --card: #161b22;
        --card2: #1c2129;
        --border: #30363d;
        --row: #21262d;
        --inset: #0d1117;
        --sticky: #0d1117;
        --glass-blur: none;
        --glass-edge: none;
        --glass-lift: none;
        --glass-fill: #161b22;
        --glass-fill-head: #0d1117;
        --glass-fill-raised: #1c2129;
        --glass-fill-row: #161b22;
        --glass-fill-flat: #1c2129;
        --glass-fill-chrome: #0d1117;
        --glass-fill-well: #0d1117;
        --glass-fill-deep: #0d1117;
        --glass-hairline: #21262d;
        --glass-groove: #21262d;
        --glass-inner: none;
        --glass-inset: none;
        --glass-inset-deep: none;
      }

      html:not([data-glass="full"]) body::before,
      html:not([data-glass="full"]) body::after {
        display: none;
      }
    }

    /* Forced colours: the OS is painting every surface itself and translucency is
       not available, so stop pretending. */
    @media (forced-colors: active) {
      body::before,
      body::after {
        display: none;
      }

      .kpi,
      .agent-card,
      .tree-row,
      .dock,
      .scroll,
      .log,
      header {
        backdrop-filter: none;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    a {
      color: var(--blue);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* The one surface that always sits over the bloom, so it is the one that always
       shows the effect. Sticky, full width and never more than a few hundred
       pixels of filter — cheap enough to refract on every board repaint. */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--glass-fill-head);
      border-bottom: 1px solid var(--border);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        0 1px 0 rgba(0, 0, 0, 0.35),
        0 14px 32px -20px rgba(0, 0, 0, 0.8);
    }

    /* ONE backdrop-filter on this page, and it is only ever on surfaces large enough
       for the effect to read. Everything below this line — every card, row,
       badge, chip, keycap, button, field and KPI tile — is pure CSS
       translucency, and it looks the same, because the bloom behind it is
       already a soft gradient: there is nothing there worth blurring.

       This is the whole performance story. backdrop-filter is not a cost the
       compositor amortises across the page — every element that declares one is
       its own snapshot of the backdrop plus its own blur pass. At 45 of them on
       a board that repaints every five seconds, the glass was not a finish, it
       was the frame budget. Four is affordable; sixty is not.

       --glass-filter is empty until the liquid-glass script measures the element
       and mints a displacement map sized to it, so this degrades to a plain
       frosted panel with no script at all. */
    header,
    .dock,
    .scroll,
    .log {
      -webkit-backdrop-filter: var(--glass-blur) var(--glass-filter, );
      backdrop-filter: var(--glass-blur) var(--glass-filter, );
    }

    /* The bulk surfaces: skip rendering when they are off screen. This is what
       makes a 5s poll affordable with glass on it — a card that is not visible
       costs no backdrop work, no shadow raster and no text layout, so a board
       with 200 of them only ever pays for the fifteen on screen.
       contain-intrinsic-size is the placeholder height used while skipped; without
       it the scrollbar would jump every time a card was skipped or un-skipped. */
    .agent-card,
    .tree-row {
      content-visibility: auto;
      contain-intrinsic-size: auto 84px;
    }

    .tree-row {
      contain-intrinsic-size: auto 27px;
    }

    /* Hover lift. The material gets a little brighter and picks up more of the
       backdrop rather than gaining a border — a border would read as a state
       change, and this is not one. */
    .agent-card:hover,
    .tree-row:hover,
    button:hover:not(:disabled),
    .attach:hover {
      background: var(--glass-fill-raised);
      border-color: var(--blue);
    }

    /* The header and dock <select>s never had a background of their own, so they
       were painting with the UA's light form control — a white slab in a dark
       bar. They are glass like every other field now, which also puts their
       dropdowns on the theme. */
    select {
      appearance: none;
      background: var(--inset);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 22px 5px 9px;
      font: inherit;
      font-size: 11px;
      font-family: var(--mono);
      box-shadow: var(--glass-lift), var(--glass-inset);
      /* the chevron is drawn rather than inherited, so it does not arrive as a
         black glyph on a dark field */
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%238b949e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 7px center;
      cursor: pointer;
    }

    select:hover {
      border-color: var(--blue);
    }

    select:focus {
      outline: none;
      border-color: var(--blue);
    }

    select option {
      background: #12161d;
      color: var(--text);
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }

    header h1 .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 8px;
      vertical-align: middle;
    }

    header h1 .dot.live {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    header h1 .dot.stale {
      background: var(--yellow);
    }

    header h1 .dot.dead {
      background: var(--red);
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot.live {
        animation: none;
      }

      .bar>i {
        transition: none;
      }
    }

    .spacer {
      flex: 1;
    }

    .meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    /* Logo — transparent outline variant, no chip. */
    .logo-chip {
      display: inline-flex;
      align-items: center;
      height: 22px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .header-logo {
      height: 20px;
      display: block;
    }

    /* Outline logo — inverted to white for dark panels, used as a watermark */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      gap: 10px;
    }

    .logo-outline {
      height: 48px;
      filter: invert(1);
      opacity: 0.07;
      pointer-events: none;
      display: block;
    }

    input[type="search"],
    input[type="text"] {
      background: var(--inset);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 9px;
      font: inherit;
      font-size: 12px;
      min-width: 210px;
      box-shadow: var(--glass-lift), var(--glass-inset);
    }

    input[type="search"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }

    button {
      background: var(--glass-fill-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 11px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      box-shadow: var(--glass-lift);
      transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }

    /* A pressed control sits *into* the glass: the top highlight inverts and the
       shadow tightens. Only affordance, no colour change — the pressed state is
       already carried by aria-pressed and the .on/.blue tint. */
    button:active:not(:disabled) {
      background: var(--glass-fill-row);
      box-shadow: var(--glass-inset);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button.on {
      border-color: var(--green);
      color: var(--green);
    }

    button[aria-pressed="true"] {
      border-color: var(--blue);
      color: var(--blue);
    }

    main {
      padding: 16px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .banner {
      border: 1px solid var(--red);
      background: linear-gradient(180deg, rgba(248, 81, 73, 0.16), rgba(248, 81, 73, 0.07));
      color: var(--banner-fg);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
      box-shadow: var(--glass-edge);
    }

    /* Not everything shown in the banner is a failure. A first run has no
       snapshot at all for a few minutes, and painting that in the error red
       reads as a broken install. */
    .banner.info {
      border-color: var(--blue);
      background: linear-gradient(180deg, rgba(88, 166, 255, 0.15), rgba(88, 166, 255, 0.06));
      color: var(--blue);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .kpi {
      background: var(--glass-fill);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: var(--glass-edge);
    }

    .kpi .label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .kpi .value {
      font-size: 22px;
      font-weight: 600;
      font-family: var(--mono);
      line-height: 1.3;
    }

    .kpi.ok .value {
      color: var(--green);
    }

    .kpi.warn .value {
      color: var(--yellow);
    }

    .kpi.bad .value {
      color: var(--red);
    }

    .kpi.info .value {
      color: var(--blue);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 22px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .section-title .count {
      font-family: var(--mono);
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
    }

    .agent-card {
      background: var(--glass-fill);
      border: 1px solid var(--border);
      /* the state stripe stays a solid 3px bar: it is the fastest read on the
         board and a translucent one would lose its edge against the bloom */
      border-left: 3px solid var(--muted);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: var(--glass-edge);
      transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    }

    .agent-card:hover {
      box-shadow: var(--glass-edge), 0 0 0 1px var(--blue-dim);
    }

    .agent-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* Selected: a blue rim rather than a colour fill, so the card underneath
       still shows what it says. */
    .agent-card.sel {
      border-color: var(--blue);
      box-shadow: var(--glass-edge), 0 0 0 1px var(--blue), 0 0 18px -4px rgba(88, 166, 255, 0.4);
    }

    .agent-card.running {
      border-left-color: var(--green);
    }

    .agent-card.busy {
      border-left-color: var(--yellow);
    }

    .agent-card.stalled {
      border-left-color: var(--yellow);
    }

    .agent-card.error {
      border-left-color: var(--red);
    }

    .agent-card.root {
      border-left-color: var(--blue);
    }

    .agent-card.child {
      margin-left: 18px;
    }

    .agent-card .row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .agent-card .title {
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-card .sub {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-fill-flat);
      color: var(--muted);
      white-space: nowrap;
      box-shadow: var(--glass-inner);
    }

    .badge.blue {
      color: var(--blue);
      border-color: var(--blue-dim);
    }

    .badge.green {
      color: var(--green);
      border-color: var(--green-dim);
    }

    .badge.yellow {
      color: var(--yellow);
      border-color: var(--yellow-dim);
    }

    .badge.red {
      color: var(--red);
      border-color: var(--red-dim);
    }

    .bar {
      height: 5px;
      /* a track, not a glass pill — it reads as a groove the fill sits in */
      background: var(--glass-groove);
      border-radius: 3px;
      overflow: hidden;
      margin: 6px 0;
      box-shadow: var(--glass-inset);
    }

    .bar>i {
      display: block;
      height: 100%;
      background: var(--green);
      transition: width 0.3s;
    }

    .bar>i.err {
      background: var(--red);
    }

    .bar>i.run {
      background: var(--blue);
    }

    .activity {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
    }

    .chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .chip {
      font-size: 10px;
      font-family: var(--mono);
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--glass-fill-flat);
      color: var(--muted);
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: var(--glass-inner);
    }

    .chip.completed {
      color: var(--green);
      border-color: var(--green-dim);
    }

    .chip.running {
      color: var(--blue);
      border-color: var(--blue-dim);
    }

    .chip.error {
      color: var(--red);
      border-color: var(--red-dim);
    }

    .tree {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--glass-fill-row);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      box-shadow: var(--glass-lift);
      transition: border-color 0.12s, background 0.12s;
    }

    .tree-row .indent {
      flex: 0 0 auto;
    }

    .tree-row .who {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--blue);
      min-width: 110px;
    }

    .tree-row .what {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Data Tables */
    /* separate borders, not collapse: collapsed borders belong to the table box and
   are not repainted with a stuck cell, which drops the header rule mid-scroll */
table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }

    /* .scroll is the scrollport for this table, so the sticky offset is relative to
   that box — not to the page header, which never overlaps it. */
th {
      text-align: left;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1;
      /* Opaque enough to hide the rows sliding under it even where
         backdrop-filter is unavailable — a sticky header you can read through is
         worse than no blur. */
      background: var(--sticky);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -1px 0 var(--border);
    }

    td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--glass-hairline);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: var(--glass-fill-flat);
    }

    tbody tr {
      transition: background 0.1s;
    }

    td.mono,
    th.mono {
      font-family: var(--mono);
      font-size: 11px;
    }

    td.num {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
    }

    .scroll {
      max-height: 560px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      /* translucent, so the bloom still reaches the rows — but with far more
         body than a card, because this is where the dense text lives */
      background: var(--glass-fill-well);
      box-shadow: var(--glass-edge);
    }

    /* the detail panel always spans the full board width */
    #detail>* {
      grid-column: 1 / -1;
    }

    .hidden {
      display: none;
    }

    .empty {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 14px;
    }

    .legend {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
    }

    .kbd {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0 4px;
      font-family: var(--mono);
      font-size: 10px;
      background: var(--glass-fill-flat);
      box-shadow: var(--glass-inner);
    }

    /* transcript log */
    .log-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
    }

    .log-bar h3 {
      margin: 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .log {
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--glass-fill-well);
      padding: 8px;
      box-shadow: var(--glass-edge);
    }

    .log-row {
      display: flex;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 6px;
      border-left: 2px solid transparent;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-row+.log-row {
      margin-top: 2px;
    }

    .log-row .who {
      flex: 0 0 62px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      padding-top: 1px;
    }

    .log-row.user {
      border-left-color: var(--blue);
      background: rgba(31, 111, 235, 0.06);
    }

    .log-row.user .who {
      color: var(--blue);
    }

    .log-row.assistant {
      border-left-color: var(--border);
    }

    .log-row.tool {
      border-left-color: var(--border);
      background: var(--glass-fill-flat);
    }

    .log-row.tool .who {
      color: var(--purple);
    }

    .log-row.reasoning {
      border-left-color: transparent;
      color: var(--muted);
      font-style: italic;
    }

    .thinking-row {
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
      padding: 3px 7px;
    }
    .thinking-row .thinking-secs {
      font-family: var(--mono);
      font-style: normal;
      color: var(--text);
    }

    .log-row .body {
      flex: 1;
      min-width: 0;
    }

    .log-row .tool-head {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .log-row .tool-out {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      margin-top: 3px;
      word-break: break-all;
    }

    .log-row .clip {
      color: var(--yellow);
      font-size: 10px;
      font-family: var(--mono);
    }

    .log-row.err .tool-out {
      color: var(--red);
    }

    details.log-more {
      margin-top: 8px;
    }

    details.log-more>summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 11px;
      font-family: var(--mono);
    }

    .md {
      line-height: 1.55;
    }
    .md p { margin: 0 0 6px; }
    .md p:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { margin: 10px 0 4px; font-weight: 600; }
    .md h1 { font-size: 14px; }
    .md h2 { font-size: 13px; }
    .md h3 { font-size: 12px; }
    .md ul, .md ol { margin: 4px 0; padding-left: 18px; }
    .md li { margin: 2px 0; }
    .md blockquote {
      margin: 4px 0;
      padding: 4px 10px;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .md code {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--glass-fill-flat);
      padding: 1px 5px;
      border-radius: 5px;
      box-shadow: var(--glass-inner);
    }
    .md pre.code-block {
      margin: 6px 0;
      padding: 8px 10px;
      background: var(--glass-fill-deep);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: auto;
      position: relative;
      box-shadow: var(--glass-inner);
    }
    .md .code-lang {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
    }

      background: none;
      padding: 0;
      font-size: 11px;
      line-height: 1.5;
      display: block;
    }
    .md table.md-table {
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 11px;
      width: auto;
      max-width: 100%;
    }
    .md table.md-table th, .md table.md-table td {
      border: 1px solid var(--border);
      padding: 3px 7px;
      text-align: left;
    }
    .md table.md-table th {
      background: var(--card2);
      font-weight: 600;
    }
    .md a {
      color: var(--blue);
      text-decoration: none;
    }
    .md a:hover { text-decoration: underline; }

    .log-empty {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px;
    }

    /* ---- chat dock ---- */
    /* Fixed right-hand panel rather than another section in the page: the board,
       tree and table are all full-width grids, and a docked panel leaves them
       readable while a chat scrolls beside them.

       This is the tallest glass surface in the app and the second most visible
       one, so it carries the full effect: a real refraction edge, and a heavier
       tint than a card because a chat transcript needs more contrast than a
       status card does. */
    .dock {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 460px;
      z-index: 40;
      display: none;
      flex-direction: column;
      background: var(--glass-fill-head);
      border-left: 1px solid var(--border);
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.1),
        -1px 0 0 rgba(0, 0, 0, 0.5),
        -22px 0 48px -18px rgba(0, 0, 0, 0.75);
    }

    body.dock-open .dock {
      display: flex;
    }

    body.dock-open main {
      margin-right: 460px;
    }

    body.dock-open header {
      padding-right: 476px;
    }

    @media (max-width: 1200px) {

      /* Too narrow to split: the dock takes the screen and the page scrolls
         underneath it. */
      .dock {
        width: 100%;
      }

      body.dock-open main {
        margin-right: 0;
      }

      body.dock-open header {
        padding-right: 16px;
      }
    }

    .dock-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--glass-fill-chrome);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      flex-wrap: wrap;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    .dock-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .dock-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    /* Font and sizing only — the field treatment (background, edge, chevron) comes
       from the shared field rules above, so the dock and the header do not end
       up with two different looking selects. */
    .dock-bar select,
    .dock-bar input[type="text"] {
      padding: 4px 7px;
      font: inherit;
      font-size: 11px;
      font-family: var(--mono);
      min-width: 0;
      max-width: 100%;
    }

    .dock-bar select {
      padding-right: 22px;
    }

    .dock-bar select:focus,
    .dock-bar input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }

    #chatWs {
      flex: 1 1 190px;
    }

    #chatModel {
      flex: 1 1 150px;
    }

    .dock-ws {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      min-width: 0;
    }

    .dock-ws .path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: rtl;
      text-align: left;
    }

    .dock-body {
      flex: 1;
      overflow: auto;
      padding: 8px;
      min-height: 0;
    }

    .dock-foot {
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      background: var(--glass-fill-chrome);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .dock-foot textarea {
      width: 100%;
      min-height: 62px;
      max-height: 190px;
      resize: vertical;
      background: var(--inset);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      font-size: 12px;
      box-shadow: var(--glass-lift), var(--glass-inset-deep);
    }

    .dock-foot textarea:focus {
      outline: none;
      border-color: var(--blue);
    }

    .dock-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .dock-actions .spacer {
      flex: 1;
    }

    .dock-note {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    /* Per-row shortcut that opens the dock already attached to that session. */
    .attach {
      border: 1px solid var(--border);
      background: var(--glass-fill-flat);
      color: var(--blue);
      border-radius: 6px;
      padding: 0 6px;
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      line-height: 17px;
      box-shadow: var(--glass-lift);
    }

    #resetBoard {
      color: var(--red);
      border-color: var(--red-dim);
    }
    #resetBoard:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.14);
    }
    #resetBoard:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 860px) {
      body.dock-open main { display: none; }
      aside.dock {
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>

<body>
  <header>

  </header>
  <main>

        spellcheck="false"></textarea>
