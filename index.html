<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Manager</title>
  <link rel="icon" href="assets/logo-mark.png">
  <style>
    /* GitHub dark palette — the house theme for ops tooling. */
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card2: #1c2129;
      --border: #30363d;
      --row: #21262d;

      --blue: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;

      /* dimmed variants, for badge and chip outlines */
      --blue-dim: #1f6feb44;
      --green-dim: #2ea04355;
      --yellow-dim: #9e6a0355;
      --red-dim: #f8514955;

      --text: #e6edf3;
      --muted: #8b949e;
      --banner-fg: #ffb4ae;

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    a {
      color: var(--blue);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--row);
      border-radius: 6px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }

    header h1 .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 8px;
      vertical-align: middle;
    }

    header h1 .dot.live {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    header h1 .dot.stale {
      background: var(--yellow);
    }

    header h1 .dot.dead {
      background: var(--red);
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot.live {
        animation: none;
      }

      .bar>i {
        transition: none;
      }
    }

    .spacer {
      flex: 1;
    }

    .meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    /* Logo — transparent outline variant, no chip. */
    .logo-chip {
      display: inline-flex;
      align-items: center;
      height: 22px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .header-logo {
      height: 20px;
      display: block;
    }

    /* Outline logo — inverted to white for dark panels, used as a watermark */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      gap: 10px;
    }

    .logo-outline {
      height: 48px;
      filter: invert(1);
      opacity: 0.07;
      pointer-events: none;
      display: block;
    }

    input[type="search"],
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 9px;
      font: inherit;
      font-size: 12px;
      min-width: 210px;
    }

    input[type="search"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }

    button {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    button:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--row);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button.on {
      border-color: var(--green);
      color: var(--green);
    }

    button[aria-pressed="true"] {
      border-color: var(--blue);
      color: var(--blue);
    }

    main {
      padding: 16px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .banner {
      border: 1px solid var(--red);
      background: rgba(248, 81, 73, 0.1);
      color: var(--banner-fg);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
    }

    /* Not everything shown in the banner is a failure. A first run has no
       snapshot at all for a few minutes, and painting that in the error red
       reads as a broken install. */
    .banner.info {
      border-color: var(--blue);
      background: rgba(88, 166, 255, 0.1);
      color: var(--blue);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .kpi .label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .kpi .value {
      font-size: 22px;
      font-weight: 600;
      font-family: var(--mono);
      line-height: 1.3;
    }

    .kpi.ok .value {
      color: var(--green);
    }

    .kpi.warn .value {
      color: var(--yellow);
    }

    .kpi.bad .value {
      color: var(--red);
    }

    .kpi.info .value {
      color: var(--blue);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 22px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .section-title .count {
      font-family: var(--mono);
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
    }

    .agent-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--muted);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.12s;
    }

    .agent-card:hover {
      border-color: var(--blue);
    }

    .agent-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .agent-card.sel {
      box-shadow: 0 0 0 1px var(--blue);
    }

    .agent-card.running {
      border-left-color: var(--green);
    }

    .agent-card.busy {
      border-left-color: var(--yellow);
    }

    .agent-card.stalled {
      border-left-color: var(--yellow);
    }

    .agent-card.error {
      border-left-color: var(--red);
    }

    .agent-card.root {
      border-left-color: var(--blue);
    }

    .agent-card.child {
      margin-left: 18px;
    }

    .agent-card .row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .agent-card .title {
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-card .sub {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.blue {
      color: var(--blue);
      border-color: var(--blue-dim);
    }

    .badge.green {
      color: var(--green);
      border-color: var(--green-dim);
    }

    .badge.yellow {
      color: var(--yellow);
      border-color: var(--yellow-dim);
    }

    .badge.red {
      color: var(--red);
      border-color: var(--red-dim);
    }

    .bar {
      height: 5px;
      background: var(--row);
      border-radius: 3px;
      overflow: hidden;
      margin: 6px 0;
    }

    .bar>i {
      display: block;
      height: 100%;
      background: var(--green);
      transition: width 0.3s;
    }

    .bar>i.err {
      background: var(--red);
    }

    .bar>i.run {
      background: var(--blue);
    }

    .activity {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
    }

    .chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .chip {
      font-size: 10px;
      font-family: var(--mono);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip.completed {
      color: var(--green);
      border-color: var(--green-dim);
    }

    .chip.running {
      color: var(--blue);
      border-color: var(--blue-dim);
    }

    .chip.error {
      color: var(--red);
      border-color: var(--red-dim);
    }

    .tree {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .tree-row:hover {
      border-color: var(--blue);
    }

    .tree-row .indent {
      flex: 0 0 auto;
    }

    .tree-row .who {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--blue);
      min-width: 110px;
    }

    .tree-row .what {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Data Tables */
    /* separate borders, not collapse: collapsed borders belong to the table box and
   are not repainted with a stuck cell, which drops the header rule mid-scroll */
table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }

    /* .scroll is the scrollport for this table, so the sticky offset is relative to
   that box — not to the page header, which never overlaps it. */
th {
      text-align: left;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bg);
      cursor: pointer;
      white-space: nowrap;
    }

    td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--row);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: var(--card);
    }

    td.mono,
    th.mono {
      font-family: var(--mono);
      font-size: 11px;
    }

    td.num {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
    }

    .scroll {
      max-height: 560px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    /* the detail panel always spans the full board width */
    #detail>* {
      grid-column: 1 / -1;
    }

    .hidden {
      display: none;
    }

    .empty {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 14px;
    }

    .legend {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
    }

    .kbd {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-family: var(--mono);
      font-size: 10px;
    }

    /* transcript log */
    .log-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
    }

    .log-bar h3 {
      margin: 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .log {
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 8px;
    }

    .log-row {
      display: flex;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 6px;
      border-left: 2px solid transparent;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-row+.log-row {
      margin-top: 2px;
    }

    .log-row .who {
      flex: 0 0 62px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      padding-top: 1px;
    }

    .log-row.user {
      border-left-color: var(--blue);
      background: rgba(31, 111, 235, 0.06);
    }

    .log-row.user .who {
      color: var(--blue);
    }

    .log-row.assistant {
      border-left-color: var(--border);
    }

    .log-row.tool {
      border-left-color: var(--border);
      background: var(--card);
    }

    .log-row.tool .who {
      color: var(--purple);
    }

    .log-row.reasoning {
      border-left-color: transparent;
      color: var(--muted);
      font-style: italic;
    }

    .thinking-row {
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
      padding: 3px 7px;
    }
    .thinking-row .thinking-secs {
      font-family: var(--mono);
      font-style: normal;
      color: var(--text);
    }

    .log-row .body {
      flex: 1;
      min-width: 0;
    }

    .log-row .tool-head {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .log-row .tool-out {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10.5px;
      margin-top: 3px;
      word-break: break-all;
    }

    .log-row .clip {
      color: var(--yellow);
      font-size: 10px;
      font-family: var(--mono);
    }

    .log-row.err .tool-out {
      color: var(--red);
    }

    details.log-more {
      margin-top: 8px;
    }

    details.log-more>summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 11px;
      font-family: var(--mono);
    }

    .md {
      line-height: 1.55;
    }
    .md p { margin: 0 0 6px; }
    .md p:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { margin: 10px 0 4px; font-weight: 600; }
    .md h1 { font-size: 14px; }
    .md h2 { font-size: 13px; }
    .md h3 { font-size: 12px; }
    .md ul, .md ol { margin: 4px 0; padding-left: 18px; }
    .md li { margin: 2px 0; }
    .md blockquote {
      margin: 4px 0;
      padding: 4px 10px;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .md code {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--card2);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .md pre.code-block {
      margin: 6px 0;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: auto;
      position: relative;
    }
    .md .code-lang {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .md pre.code-block code {
      background: none;
      padding: 0;
      font-size: 11px;
      line-height: 1.5;
      display: block;
    }
    .md table.md-table {
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 11px;
      width: auto;
      max-width: 100%;
    }
    .md table.md-table th, .md table.md-table td {
      border: 1px solid var(--border);
      padding: 3px 7px;
      text-align: left;
    }
    .md table.md-table th {
      background: var(--card2);
      font-weight: 600;
    }
    .md a {
      color: var(--blue);
      text-decoration: none;
    }
    .md a:hover { text-decoration: underline; }

    .log-empty {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px;
    }

    /* ---- chat dock ---- */
    /* Fixed right-hand panel rather than another section in the page: the board,
       tree and table are all full-width grids, and a docked panel leaves them
       readable while a chat scrolls beside them. */
    .dock {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 460px;
      z-index: 40;
      display: none;
      flex-direction: column;
      background: var(--card);
      border-left: 1px solid var(--border);
      box-shadow: -12px 0 32px rgba(1, 4, 9, 0.5);
    }

    body.dock-open .dock {
      display: flex;
    }

    body.dock-open main {
      margin-right: 460px;
    }

    body.dock-open header {
      padding-right: 476px;
    }

    @media (max-width: 1200px) {

      /* Too narrow to split: the dock takes the screen and the page scrolls
         underneath it. */
      .dock {
        width: 100%;
      }

      body.dock-open main {
        margin-right: 0;
      }

      body.dock-open header {
        padding-right: 16px;
      }
    }

    .dock-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .dock-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .dock-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .dock-bar select,
    .dock-bar input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 7px;
      font: inherit;
      font-size: 11px;
      font-family: var(--mono);
      min-width: 0;
      max-width: 100%;
    }

    .dock-bar select:focus,
    .dock-bar input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }

    #chatWs {
      flex: 1 1 190px;
    }

    #chatModel {
      flex: 1 1 150px;
    }

    .dock-ws {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      min-width: 0;
    }

    .dock-ws .path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: rtl;
      text-align: left;
    }

    .dock-body {
      flex: 1;
      overflow: auto;
      padding: 8px;
      min-height: 0;
    }

    .dock-foot {
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      background: var(--bg);
    }

    .dock-foot textarea {
      width: 100%;
      min-height: 62px;
      max-height: 190px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 9px;
      font: inherit;
      font-size: 12px;
    }

    .dock-foot textarea:focus {
      outline: none;
      border-color: var(--blue);
    }

    .dock-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .dock-actions .spacer {
      flex: 1;
    }

    .dock-note {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    /* Per-row shortcut that opens the dock already attached to that session. */
    .attach {
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--blue);
      border-radius: 5px;
      padding: 0 6px;
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      line-height: 17px;
    }

    .attach:hover {
      border-color: var(--blue);
      background: var(--row);
    }

    #resetBoard {
      color: var(--red);
      border-color: var(--red-dim);
    }
    #resetBoard:hover {
      background: rgba(248, 81, 73, 0.08);
    }
    #resetBoard:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <header>
    <h1><span class="logo-chip"><img class="header-logo" src="assets/logo-outline.png" alt="Kilo Code" height="20"></span><span class="dot" id="liveDot"></span>Agent Manager</h1>
    <span class="meta" id="meta">starting…</span>
    <span class="meta" id="tokenTotal" title="total tokens across tracked sessions"></span>
    <select id="headerDir" title="chat workspace directory" style="max-width:220px"></select>
    <span class="badge" id="headerDirSource" style="margin-right:8px">—</span>
    <select id="catalogTools" title="installed agents, commands, skills and tools" style="max-width:200px"></select>
    <div class="spacer"></div>
    <input type="search" id="search" placeholder="filter sessions, agents, activity…  ( / )" autocomplete="off">
    <button id="autoBtn" aria-pressed="true" title="poll state.json every 5s">Auto 5s</button>
    <button id="refresh" title="refresh now ( r )">Refresh</button>
    <button id="chatToggle" aria-pressed="false" title="open the chat window ( c )">Chat</button>
    <button id="resetBoard" title="clear state.json and cache, board goes empty until next collect">Reset board</button>
  </header>
  <main>
    <div class="banner hidden" id="banner"></div>
    <div class="kpis" id="kpis"></div>

    <div class="section-title">Live agents <span class="count" id="liveCount"></span></div>
    <div class="board" id="board"></div>

    <div class="section-title">Subagent task tree <span class="count" id="treeCount"></span></div>
    <div class="tree" id="tree"></div>

    <div class="section-title">Sessions <span class="count" id="sessCount"></span> <span class="legend">click a column
        header to sort · <span class="kbd">/</span> search · <span class="kbd">r</span> refresh ·
        <span class="kbd">c</span> chat</span></div>
    <div class="scroll">
      <table id="sessions">
        <thead>
          <tr>
            <th data-sort="title">Title</th>
            <th data-sort="agent" class="mono">Agent</th>
            <th data-sort="state">State</th>
            <th data-sort="progress" class="num">Tasks</th>
            <th data-sort="tools" class="num">Tools</th>
            <th data-sort="tokens" class="num">Tokens</th>
            <th data-sort="updated">Updated</th>
            <th class="mono">ID</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section-title" id="detailTitle">Session detail</div>
    <div class="board" id="detail"></div>
  </main>

  <aside class="dock" id="dock" aria-label="Chat">
    <div class="dock-head">
      <h2>Chat</h2>
      <span class="badge" id="chatState">idle</span>
      <div class="spacer"></div>
      <button id="chatWsReload" title="re-detect the folder open in VSCodium">Detect</button>
      <button id="chatClose" title="close ( c )">✕</button>
    </div>

    <div class="dock-ws">
      <span class="path" id="chatWsPath">—</span>
      <span class="badge" id="chatWsSource">—</span>
    </div>

    <div class="dock-bar">
      <select id="chatDir" title="workspace directory"></select>
      <select id="chatModel" title="model"></select>
      <button id="chatNew" title="start a new conversation in this workspace">New</button>
    </div>

    <div class="dock-body" id="chatBody"></div>

    <div class="dock-foot">
      <textarea id="chatInput" placeholder="Ask about this workspace…  ( Enter to send · Shift+Enter for a newline )"
        spellcheck="false"></textarea>
      <div class="dock-actions">
        <button id="chatSend" disabled>Send</button>
        <button id="chatStop" class="hidden" title="stop the running turn">Stop</button>
        <div class="spacer"></div>
        <span class="dock-note" id="chatNote"></span>
      </div>
    </div>
  </aside>
  <script>
    (function () {
      'use strict';

      const $ = (s) => document.querySelector(s);
      const append = (n, k) => {
        if (k === null || k === undefined || k === false || k === '') return;
        if (Array.isArray(k)) { k.forEach((x) => append(n, x)); return; }
        n.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
      };
      const el = (tag, cls, ...kids) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        kids.forEach((k) => append(n, k));
        return n;
      };

      const state = {
        data: null, selected: null, query: '', sort: 'updated', desc: true, auto: true,
        showReasoning: true, fullLog: null, logLoading: false, logError: null
      };

      try { state.auto = localStorage.getItem('am.auto') !== '0'; } catch (e) { /* private mode */ }
      try { state.showReasoning = localStorage.getItem('am.reasoning') !== '0'; } catch (e) { /* private mode */ }

      const num = (n) => (n || 0).toLocaleString();
      const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

      function rel(ts) {
        if (!ts) return '—';
        const d = Date.now() - ts;
        if (d < 0) return 'just now';
        if (d < 60000) return Math.floor(d / 1000) + 's ago';
        if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
        if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
        return Math.floor(d / 86400000) + 'd ago';
      }

      // session state is derived from the newest tool call we exported; a tool left
      // "running" long after the session last moved is stalled, not live
      function sessionState(d) {
        if (!d || d.error) return { key: 'unknown', label: 'no detail', cls: '' };
        const fresh = Boolean(d.updatedAt) && Date.now() - d.updatedAt < 120000;
        if (d.lastToolStatus === 'running') {
          return fresh
            ? { key: 'running', label: 'running', cls: 'green' }
            : { key: 'stalled', label: 'stalled', cls: 'yellow' };
        }
        if (fresh) return { key: 'busy', label: 'active', cls: 'yellow' };
        if (d.tools.running > 0) return { key: 'stalled', label: 'stalled', cls: 'yellow' };
        if (d.tools.error > 0) return { key: 'error', label: 'errors', cls: 'red' };
        return { key: 'done', label: 'idle', cls: '' };
      }

      const taskDone = (d) => (d.tasks || []).filter((t) => t.state === 'completed').length;
      const taskTotal = (d) => (d.tasks || []).length;

      // selecting a different session drops any transcript that was loaded for the
      // previous one, otherwise the log panel would show the wrong conversation
      function select(id) {
        state.selected = state.selected === id ? null : id;
        if (state.fullLog && (!state.selected || state.fullLog.id !== state.selected)) {
          state.fullLog = null;
          state.logError = null;
        }
        render();
      }

      function matches(d, q) {
        if (!q) return true;
        return (
          (d.title || '').toLowerCase().includes(q) ||
          (d.agent || '').toLowerCase().includes(q) ||
          (d.id || '').toLowerCase().includes(q) ||
          (d.lastText || '').toLowerCase().includes(q) ||
          (d.lastTool || '').toLowerCase().includes(q)
        );
      }

      function kpi(label, value, cls) {
        return el('div', 'kpi' + (cls ? ' ' + cls : ''), el('div', 'label', label), el('div', 'value', value));
      }

      function bar(done, total, err) {
        const b = el('div', 'bar');
        const i = el('i', err ? 'err' : null);
        i.style.width = pct(done, total) + '%';
        b.appendChild(i);
        return b;
      }

      function agentCard(d, byId) {
        const st = sessionState(d);
        const isChild = Boolean(d.parentId);
        const card = el('div', 'agent-card ' + st.key + (isChild ? ' child' : ' root') +
          (state.selected === d.id ? ' sel' : ''));
        card.tabIndex = 0;
        card.onclick = () => select(d.id);
        card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } };

        const title = el('div', 'title', d.title || d.id);
        title.title = d.title || d.id;
        card.appendChild(el('div', 'row1',
          el('span', 'badge ' + st.cls, st.label),
          title,
          el('span', 'badge', d.agent || '?'),
          attachButton(d)
        ));

        card.appendChild(el('div', 'sub',
          el('span', null, rel(d.updatedAt)),
          el('span', null, num(d.tools.total) + ' tools'),
          el('span', null, num(d.messages) + ' msgs'),
          taskTotal(d) ? el('span', null, taskDone(d) + '/' + taskTotal(d) + ' tasks') : null
        ));

        if (d.error) {
          card.appendChild(el('div', 'activity', 'error: ' + d.error));
        } else {
          card.appendChild(bar(taskDone(d) || d.tools.completed, taskTotal(d) || d.tools.total, d.tools.error > 0));
          const act = d.lastToolStatus === 'running'
            ? '▶ ' + (d.lastTool || 'working')
            : (d.lastText || d.lastTool || 'no activity yet');
          const a = el('div', 'activity', act);
          a.title = act;
          card.appendChild(a);
          const chips = (d.tasks || []).slice(0, 6).map((t) => {
            const cls = t.state === 'completed' ? 'completed' : t.state === 'error' ? 'error' : 'running';
            const c = el('span', 'chip ' + cls, (t.subagentType || 'task') + ': ' + (t.description || t.childId || ''));
            c.title = t.state + ' — ' + (t.description || t.childId || '');
            return c;
          });
          if (chips.length) card.appendChild(el('div', 'chips', chips));
        }
        return card;
      }

      function treeRow(d, depth) {
        const st = sessionState(d);
        const row = el('div', 'tree-row');
        row.onclick = () => select(d.id);
        const what = el('div', 'what', (d.tasks || []).length
          ? (d.tasks || []).map((t) => (t.state === 'completed' ? '✓' : t.state === 'error' ? '✗' : '·') + ' ' + (t.description || t.subagentType || t.childId)).join('   ·   ')
          : (d.lastText || d.lastTool || d.title || ''));
        row.append(
          el('span', 'indent', '│ '.repeat(depth)),
          el('span', 'badge ' + st.cls, st.label),
          el('span', 'who', d.agent || '?'),
          el('span', 'what', what),
          el('span', 'badge', rel(d.updatedAt))
        );
        return row;
      }

      // Small in-house markdown renderer. No deps, no innerHTML on model output.
      function renderMd(text) {
        const wrap = el('div', 'md');
        if (!text) { wrap.appendChild(el('span', null, '')); return wrap; }
        let src = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const codeBlocks = [];
        src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, body) => {
          codeBlocks.push({ lang: lang || '', body: body.replace(/\n$/, '') });
          return '\x00CODE' + (codeBlocks.length - 1) + '\x00';
        });
        const rawBlocks = src.split(/\n{2,}/);
        for (const raw of rawBlocks) {
          const block = raw.trim();
          if (!block) continue;
          const codeMatch = block.match(/^\x00CODE(\d+)\x00$/);
          if (codeMatch) {
            const cb = codeBlocks[parseInt(codeMatch[1])];
            const pre = el('pre', 'code-block');
            if (cb.lang) pre.appendChild(el('span', 'code-lang', cb.lang));
            const code = el('code');
            code.textContent = cb.body;
            pre.appendChild(code);
            wrap.appendChild(pre);
            continue;
          }
          if (block.includes('|') && /^\|?[\s-]+\|/.test(block)) {
            const rows = block.split('\n').filter(l => /^\|/.test(l.trim()));
            if (rows.length >= 2) {
              const table = el('table', 'md-table');
              const tbody = el('tbody');
              const sep = rows.findIndex(r => /^\|[\s\-:|]+\|$/.test(r.trim()));
              const headerRows = sep > 0 ? rows.slice(0, sep) : [rows[0]];
              const dataRows = sep > 0 ? rows.slice(sep + 1) : rows.slice(1);
              for (const row of headerRows) {
                const tr = el('tr');
                row.split('|').filter(c => c.trim()).forEach(cell => tr.appendChild(el('th', null, cell.trim())));
                tbody.appendChild(tr);
              }
              for (const row of dataRows) {
                const tr = el('tr');
                row.split('|').filter(c => c.trim()).forEach(cell => tr.appendChild(el('td', null, cell.trim())));
                tbody.appendChild(tr);
              }
              table.appendChild(tbody);
              wrap.appendChild(table);
              continue;
            }
          }
          const headingMatch = block.match(/^(#{1,6})\s+(.+)$/);
          if (headingMatch) {
            wrap.appendChild(el('h' + headingMatch[1].length, null, inlineMd(headingMatch[2])));
            continue;
          }
          if (block.startsWith('> ')) {
            const lines = block.split('\n').map(l => l.replace(/^>\s?/, '')).join('\n');
            wrap.appendChild(el('blockquote', null, inlineMd(lines)));
            continue;
          }
          if (/^[-*]\s/.test(block)) {
            const ul = el('ul');
            for (const line of block.split('\n')) {
              const m = line.match(/^[-*]\s+(.+)$/);
              if (m) ul.appendChild(el('li', null, inlineMd(m[1])));
            }
            wrap.appendChild(ul);
            continue;
          }
          if (/^\d+\.\s/.test(block)) {
            const ol = el('ol');
            for (const line of block.split('\n')) {
              const m = line.match(/^\d+\.\s+(.+)$/);
              if (m) ol.appendChild(el('li', null, inlineMd(m[1])));
            }
            wrap.appendChild(ol);
            continue;
          }
          wrap.appendChild(el('p', null, inlineMd(block)));
        }
        return wrap;
      }

      function inlineMd(text) {
        const frag = document.createDocumentFragment();
        const parts = text.split(/(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\([^)]+\))/g);
        for (const part of parts) {
          if (!part) continue;
          if (part.startsWith('`') && part.endsWith('`')) {
            frag.appendChild(el('code', null, part.slice(1, -1)));
          } else if (part.startsWith('**') && part.endsWith('**')) {
            frag.appendChild(el('strong', null, part.slice(2, -2)));
          } else if (part.startsWith('*') && part.endsWith('*')) {
            frag.appendChild(el('em', null, part.slice(1, -1)));
          } else if (part.startsWith('[') && part.includes('](') && part.endsWith(')')) {
            const m = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            if (m) {
              const a = el('a', null, m[1]);
              a.href = m[2];
              a.rel = 'noopener noreferrer';
              a.target = '_blank';
              frag.appendChild(a);
            } else {
              frag.appendChild(document.createTextNode(part));
            }
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        }
        return frag;
      }

      function logRow(e) {
        if (e.k === 'reasoning' && !state.showReasoning) return null;

        if (e.k === 'tool') {
          const row = el('div', 'log-row tool' + (e.st === 'error' ? ' err' : ''));
          const cls = e.st === 'completed' ? 'green' : e.st === 'error' ? 'red' : e.st === 'running' ? 'blue' : '';
          row.appendChild(el('span', 'who', e.st ? e.st.slice(0, 4) : 'tool'));
          const body = el('div', 'body');
          body.appendChild(el('div', 'tool-head', el('span', null, e.tool || 'tool'), el('span', 'badge ' + cls, e.st || '—')));
          if (e.t) body.appendChild(el('div', 'tool-out', e.t));
          if (e.o) {
            const preview = String(e.o).replace(/\s+/g, ' ').trim();
            const max = 400;
            if (preview.length > max) {
              const short = preview.slice(0, max);
              const out = el('div', 'tool-out', short);
              const more = el('button', 'log-more', 'show more');
              more.onclick = () => {
                out.textContent = preview;
                more.remove();
              };
              out.appendChild(more);
              body.appendChild(out);
            } else {
              body.appendChild(el('div', 'tool-out', preview));
            }
          }
          row.appendChild(body);
          return row;
        }

        const row = el('div', 'log-row ' + (e.r === 'user' ? 'user' : e.k === 'reasoning' ? 'reasoning' : 'assistant'));
        row.appendChild(el('span', 'who', e.k === 'reasoning' ? 'think' : e.r === 'user' ? 'you' : 'agent'));
        const body = el('div', 'body');
        if (e.k === 'reasoning') {
          body.textContent = e.t || '';
        } else if (e.r === 'user') {
          body.textContent = e.t || '';
        } else {
          body.appendChild(renderMd(e.t || ''));
        }
        if (e.tr) body.appendChild(el('span', 'clip', ' …clipped'));
        row.appendChild(body);
        return row;
      }

      function logSection(d) {
        const wrap = el('div');
        const bar = el('div', 'log-bar');

        const reasonBtn = el('button', state.showReasoning ? 'on' : null, 'Reasoning');
        reasonBtn.title = 'show model reasoning in the log';
        reasonBtn.onclick = () => {
          state.showReasoning = !state.showReasoning;
          try { localStorage.setItem('am.reasoning', state.showReasoning ? '1' : '0'); } catch (e) { /* ignore */ }
          render();
        };

        const entries = (state.fullLog && state.fullLog.id === d.id ? state.fullLog.log : d.log) || [];
        const shown = entries.filter((e) => e.k !== 'reasoning' || state.showReasoning);

        bar.appendChild(el('h3', null, 'Chat log — ' + num(shown.length) + ' entries'));
        bar.appendChild(reasonBtn);

        if (!state.fullLog || state.fullLog.id !== d.id) {
          const full = el('button', null, state.logLoading ? 'Loading full log…' : 'Load full log');
          full.disabled = state.logLoading;
          full.title = 'runs kilo export for this session — slower, but the entire conversation';
          full.onclick = () => loadFullLog(d.id);
          bar.appendChild(full);
        } else {
          bar.appendChild(el('span', 'badge blue', num(state.fullLog.total) + ' total'));
          bar.appendChild(el('button', null, 'Back to recent'));
          bar.lastChild.onclick = () => { state.fullLog = null; render(); };
        }
        if (d.logTruncated && (!state.fullLog || state.fullLog.id !== d.id)) {
          bar.appendChild(el('span', 'badge yellow', 'showing recent ' + num(entries.length)));
        }
        wrap.appendChild(bar);

        const box = el('div', 'log');
        if (state.logLoading && (!state.fullLog || state.fullLog.id !== d.id)) {
          box.appendChild(el('div', 'log-empty', 'loading full transcript…'));
        } else if (state.logError && state.logError.id === d.id) {
          box.appendChild(el('div', 'log-empty', 'could not load full log: ' + state.logError.message));
        } else if (!shown.length) {
          box.appendChild(el('div', 'log-empty', 'no transcript entries in this snapshot — run collector with --transcript 40'));
        } else {
          const rows = shown.map(logRow).filter(Boolean);
          rows.forEach((r) => box.appendChild(r));
          // land the reader at the most recent turn
          queueMicrotask(() => { box.scrollTop = box.scrollHeight; });
        }
        wrap.appendChild(box);
        return wrap;
      }

      async function loadFullLog(id) {
        state.logLoading = true;
        state.logError = null;
        render();
        try {
          const r = await fetch('/api/session/' + encodeURIComponent(id) + '?limit=2000&chars=4000', { cache: 'no-store' });
          const j = await r.json();
          if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
          state.fullLog = j;
        } catch (err) {
          state.logError = { id, message: err && err.message ? err.message : String(err) };
        } finally {
          state.logLoading = false;
          render();
        }
      }

      function detailPanel(d) {
        const box = el('div', 'agent-card');
        box.style.cursor = 'default';
        box.appendChild(el('div', 'row1', el('span', 'badge blue', d.id), el('span', 'title', d.title || '')));
        if (d.error) { box.appendChild(el('div', 'activity', 'error: ' + d.error)); return box; }

        const kv = (k, v) => el('div', 'sub', el('span', null, k + ': '), el('span', null, v));
        const tk = d.tokens || {};
        box.appendChild(el('div', 'sub',
          kv('agent', d.agent || '?'),
          kv('model', d.model || '?'),
          kv('messages', num(d.messages)),
          kv('in', num(tk.input)), kv('out', num(tk.output)),
          kv('reasoning', num(tk.reasoning)),
          kv('cache read', num(tk.cache && tk.cache.read)),
          kv('cost', (d.cost || 0).toFixed(4)),
          kv('dir', d.directory || '?')
        ));

        box.appendChild(el('div', 'sub', 'tools: ' + num(d.tools.completed) + ' ok / ' +
          num(d.tools.error) + ' err / ' + num(d.tools.running) + ' running / ' + num(d.tools.total) + ' total'));

        if ((d.tasks || []).length) {
          const list = el('div');
          d.tasks.forEach((t) => {
            const cls = t.state === 'completed' ? 'completed' : t.state === 'error' ? 'error' : 'running';
            list.appendChild(el('div', 'chip ' + cls,
              t.state + '  ' + (t.subagentType || '') + '  ' + (t.description || t.childId || '')));
          });
          box.appendChild(el('div', 'chips', Array.from(list.children)));
        }

        if ((d.filesTouched || []).length) {
          box.appendChild(el('div', 'sub', 'files: ' + d.filesTouched.slice(0, 12).join(', ') +
            (d.filesTouched.length > 12 ? ' +' + (d.filesTouched.length - 12) : '')));
        }

        const byType = Object.entries(d.tools.byType || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
        if (byType.length) {
          const tbl = el('table');
          const tb = el('tbody');
          byType.forEach(([n, c]) => tb.appendChild(el('tr', null, el('td', 'mono', n), el('td', 'num', num(c)))));
          tbl.appendChild(tb);
          box.appendChild(tbl);
        }

        box.appendChild(logSection(d));
        return box;
      }

      const COLS = {
        title: (d) => (d.title || '').toLowerCase(),
        agent: (d) => (d.agent || '').toLowerCase(),
        state: (d) => sessionState(d).key,
        progress: (d) => taskTotal(d),
        tools: (d) => d.tools.total || 0,
        tokens: (d) => (d.tokens && d.tokens.input) || 0,
        updated: (d) => d.updatedAt || 0
      };

      function render() {
        const data = state.data;
        if (!data) return;

        const details = (data.details || []).slice();
        const byId = new Map(details.map((d) => [d.id, d]));
        const q = state.query.trim().toLowerCase();

        // only show detailed sessions in the live board; sessions without an export
        // have no activity to show
        const live = details.filter((d) => matches(d, q));
        const roots = live.filter((d) => !d.parentId);
        const children = live.filter((d) => d.parentId);

        // ---- header ----
        const age = Date.now() - new Date(data.generatedAt || 0).getTime();
        const dot = $('#liveDot');
        dot.className = 'dot ' + (!isFinite(age) || age > 60000 ? 'dead' : age > 20000 ? 'stale' : 'live');
        $('#meta').textContent =
          'kilo v' + (data.version || '?') + ' · ' + (data.agents || []).length + ' agents · ' +
          (data.sessions || []).length + ' sessions · tracked ' + details.length + ' · updated ' +
          rel(new Date(data.generatedAt || 0).getTime());

        const totalTokens = details.reduce((s, d) => {
          const t = d.tokens || {};
          return s + (t.input || 0) + (t.output || 0) + (t.reasoning || 0);
        }, 0);
        $('#tokenTotal').textContent = totalTokens ? num(totalTokens) + ' tokens' : '';

        // ---- errors ----
        const errs = data.errors || [];
        const banner = $('#banner');
        if (errs.length) {
          banner.textContent = 'collector reported ' + errs.length + ' problem(s):\n  ' + errs.join('\n  ') +
            '\n\nfix: run  node collector.mjs --detail 8   in this folder';
          banner.classList.remove('hidden');
        } else if (!details.length) {
          banner.textContent = 'No session details captured yet. Run:  node collector.mjs --detail 8';
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }

        // ---- kpis ----
        const allTasks = details.reduce((n, d) => n + taskTotal(d), 0);
        const doneTasks = details.reduce((n, d) => n + taskDone(d), 0);
        const running = details.filter((d) => sessionState(d).key === 'running').length;
        const errCount = details.reduce((n, d) => n + (d.tools.error || 0), 0);
        $('#kpis').replaceChildren(
          kpi('Agents', num((data.agents || []).length), 'info'),
          kpi('Primary', num((data.agents || []).filter((a) => a.mode === 'primary').length)),
          kpi('Subagents', num((data.agents || []).filter((a) => a.mode === 'subagent').length), 'info'),
          kpi('Sessions', num((data.sessions || []).length)),
          kpi('Tracked', num(details.length)),
          kpi('Running now', num(running), running ? 'ok' : ''),
          kpi('Tasks done', num(doneTasks) + ' / ' + num(allTasks), allTasks && doneTasks === allTasks ? 'ok' : 'warn'),
          kpi('Tool errors', num(errCount), errCount ? 'bad' : '')
        );

        // ---- live board ----
        $('#liveCount').textContent = '(' + live.length + (q ? ' matching "' + q + '"' : '') + ')';
        const board = $('#board');
        board.replaceChildren();
        if (!live.length) {
          board.appendChild(el('div', 'empty', q ? 'no live agent matches "' + q + '"' : 'no session details in state.json — run node collector.mjs'));
        } else {
          roots.forEach((d) => board.appendChild(agentCard(d, byId)));
          children.forEach((d) => board.appendChild(agentCard(d, byId)));
        }

        // ---- tree ----
        $('#treeCount').textContent = '(' + roots.length + ' root' + (roots.length === 1 ? '' : 's') + ', ' +
          children.length + ' subagent' + (children.length === 1 ? '' : 's') + ')';
        const tree = $('#tree');
        tree.replaceChildren();
        if (!live.length) {
          tree.appendChild(el('div', 'empty', 'nothing to map'));
        } else {
          const emitted = new Set();
          const emit = (d, depth) => {
            if (emitted.has(d.id)) return;
            emitted.add(d.id);
            tree.appendChild(treeRow(d, depth));
            (d.children || []).forEach((cid) => { const c = byId.get(cid); if (c && live.includes(c)) emit(c, depth + 1); });
          };
          roots.forEach((d) => emit(d, 0));
          children.forEach((d) => emit(d, 0)); // orphans keep depth 0 rather than disappearing
        }

        // ---- sessions table ----
        const all = (data.details || []).map((d) => d);
        const sortKey = COLS[state.sort] || COLS.updated;
        all.sort((a, b) => {
          const x = sortKey(a), y = sortKey(b);
          return (x < y ? -1 : x > y ? 1 : 0) * (state.desc ? -1 : 1);
        });
        const tb = $('#sessions').querySelector('tbody');
        tb.replaceChildren();
        const shown = q ? all.filter((d) => matches(d, q)) : all;
        $('#sessCount').textContent = '(' + shown.length + (q ? ' of ' + all.length : '') + ')';
        if (!shown.length) {
          tb.appendChild(el('tr', null, el('td', null, el('div', 'empty', 'no sessions match'))));
        }
        shown.forEach((d) => {
          const st = sessionState(d);
          const tr = el('tr');
          const titleCell = el('td');
          const a = el('a', null, d.title || d.id);
          a.href = '#';
          a.onclick = (e) => { e.preventDefault(); select(d.id); };
          titleCell.appendChild(a);
          titleCell.appendChild(document.createTextNode(' '));
          titleCell.appendChild(attachButton(d));
          tr.appendChild(titleCell);
          tr.appendChild(el('td', 'mono', d.agent || '—'));
          tr.appendChild(el('td', null, el('span', 'badge ' + st.cls, st.label)));
          tr.appendChild(el('td', 'num', taskTotal(d) ? taskDone(d) + '/' + taskTotal(d) : '—'));
          tr.appendChild(el('td', 'num', num(d.tools.total)));
          tr.appendChild(el('td', 'num', num(d.tokens && d.tokens.input)));
          tr.appendChild(el('td', 'mono', rel(d.updatedAt)));
          tr.appendChild(el('td', 'mono', d.id));
          tr.onclick = (e) => { if (e.target.tagName !== 'A') select(d.id); };
          if (state.selected === d.id) tr.style.background = '#1f6feb22';
          tb.appendChild(tr);
        });

        // ---- detail ----
        const sel = state.selected ? byId.get(state.selected) : null;
        $('#detailTitle').textContent = sel ? 'Session detail — ' + (sel.title || sel.id) : 'Session detail (select a card or row)';
        $('#detail').replaceChildren();
        if (sel) $('#detail').appendChild(detailPanel(sel));
        else {
        const empty = el('div', 'empty detail-empty');
        const img = document.createElement('img');
        img.className = 'logo-outline';
        img.src = 'assets/logo-outline.png';
        img.alt = '';
        empty.appendChild(img);
        empty.appendChild(document.createTextNode('click any agent card, tree row, or session title to inspect it here'));
        $('#detail').appendChild(empty);
      }
      }

      let timer = null;
      function scheduleAuto() {
        if (timer) clearInterval(timer);
        timer = null;
        if (!state.auto) return;
        timer = setInterval(load, 5000);
      }

      async function load() {
        try {
          const r = await fetch('state.json', { cache: 'no-store' });
          if (!r.ok) throw new Error('state.json → HTTP ' + r.status);
          const data = await r.json();
          if (!data || typeof data !== 'object') throw new Error('state.json is not an object');
          state.data = data;
          render();
        } catch (err) {
          await showLoadFailure(err);
        }
      }

      // A missing snapshot is the normal state of a first run: the packaged app
      // extracts its payload, then spends minutes on the first collect. Showing
      // that as a red failure told the user to run `node collector.mjs`, a
      // command that does not exist for someone who only double-clicked an exe.
      //
      // A 404 on its own cannot tell "still building" from "collector is
      // broken" — both are a missing file that never arrives — so ask the
      // backend which one it is rather than guessing.
      async function showLoadFailure(err) {
        const banner = $('#banner');
        const message = err && err.message ? err.message : String(err);

        const show = (text, info) => {
          banner.textContent = text;
          banner.classList.remove('hidden');
          banner.classList.toggle('info', !!info);
        };

        if (!/HTTP 404$/.test(message)) {
          show('Could not load state.json: ' + message, false);
          return;
        }

        let health = null;
        try {
          const r = await fetch('api/health', { cache: 'no-store' });
          if (r.ok) health = await r.json();
        } catch (e) {
          // Older backend without the endpoint: fall through to the neutral text.
        }

        if (health && health.collecting) {
          // Checked before lastCollectError on purpose: a retry is running right
          // now, so any earlier failure is already being dealt with. Reporting it
          // as current turns every retry into a fresh red banner.
          show(
            'Building the first snapshot… the first pass reads every session and can take a few minutes. It refreshes on its own — nothing to do.',
            true
          );
          return;
        }

        if (health && health.lastCollectError) {
          show(
            'The collector failed, so there is no snapshot to show:\n  ' +
              String(health.lastCollectError).slice(0, 600) +
              '\n\nThe same error is in backend.log beside the app.',
            false
          );
          return;
        }

        show(
          'No snapshot yet. The backend keeps retrying on its own; nothing to do.',
          true
        );
      }

      // ---- controls ----
      $('#refresh').addEventListener('click', load);

      const autoBtn = $('#autoBtn');
      const paintAuto = () => {
        autoBtn.setAttribute('aria-pressed', String(state.auto));
        autoBtn.textContent = state.auto ? 'Auto 5s' : 'Paused';
        autoBtn.classList.toggle('on', state.auto);
      };
      autoBtn.addEventListener('click', () => {
        state.auto = !state.auto;
        try { localStorage.setItem('am.auto', state.auto ? '1' : '0'); } catch (e) { /* ignore */ }
        paintAuto();
        scheduleAuto();
      });

      const search = $('#search');
      let typing = null;
      search.addEventListener('input', () => {
        if (typing) clearTimeout(typing);
        typing = setTimeout(() => { state.query = search.value; render(); }, 120);
      });

      document.querySelectorAll('th[data-sort]').forEach((th) => {
        th.addEventListener('click', () => {
          const k = th.dataset.sort;
          if (state.sort === k) state.desc = !state.desc;
          else { state.sort = k; state.desc = k !== 'title' && k !== 'agent'; }
          render();
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.target === search) {
          if (e.key === 'Escape') { search.value = ''; state.query = ''; render(); search.blur(); }
          return;
        }
        // Never steal single-key shortcuts from a field the user is typing in —
        // "/" and "r" are ordinary characters in a chat message.
        const typing = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' ||
          (e.target.tagName === 'INPUT' && e.target.type !== 'range'));
        if (typing) {
          if (e.key === 'Escape') { e.target.blur(); if (chat.open && e.target === chatInput) setDock(false); }
          return;
        }
        if (e.key === '/') { e.preventDefault(); search.focus(); }
        else if (e.key === 'r') { e.preventDefault(); load(); }
        else if (e.key === 'c' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); setDock(!chat.open); }
        else if (e.key === 'Escape') { state.selected = null; render(); }
      });

      // ---- chat dock ----
      // The dock owns one kilo session at a time. Entries are held in a map keyed
      // by kilo part id so streamed deltas and full part updates land on the same
      // row instead of appending duplicates.
      const chat = {
        open: false, workspace: null, source: null, directory: null,
        sessionId: null, model: '', models: [], dirs: [],
        raw: new Map(), order: [], base: [], roles: new Map(),
        es: null, streaming: false, error: null, loading: false, note: '',
        thinkingStart: null,
      };

      // A part event carries no role — only the message event does — and the part
      // can arrive first. So kilo parts are kept raw and turned into rows at
      // render time, by which point the role is known; backfilled entries are
      // already role-tagged and kept separately in `base`.
      const roleOf = (messageID) => (chat.roles.get(messageID) === 'user' ? 'user' : 'assistant');

      // Coalesce renders so N SSE deltas in one frame cause one DOM rebuild.
      let chatRenderRaf = null;

      function scheduleChatRender() {
        if (chatRenderRaf !== null) return;
        chatRenderRaf = requestAnimationFrame(() => {
          chatRenderRaf = null;
          renderChat();
        });
      }

      function flushChatRender() {
        if (chatRenderRaf !== null) {
          cancelAnimationFrame(chatRenderRaf);
          chatRenderRaf = null;
        }
        renderChat();
      }

      const partEntry = (part) => {
        if (!part) return null;
        const role = roleOf(part.messageID);
        if (part.type === 'text') return { r: role, k: 'text', t: part.text || '', st: null };
        if (part.type === 'reasoning') return { r: 'assistant', k: 'reasoning', t: part.text || '', st: null };
        if (part.type === 'tool') {
          const s = part.state || {};
          const snip = s.status === 'error' ? (s.error || s.output) : s.output;
          return {
            r: 'assistant', k: 'tool', tool: part.tool || 'tool', st: s.status || 'unknown',
            t: s.title || part.tool || '', o: String(snip == null ? '' : snip).replace(/\s+/g, ' ').trim(),
          };
        }
        return null;
      };

      function chatReset(sessionId, directory) {
        chat.raw = new Map();
        chat.order = [];
        chat.base = [];
        chat.roles = new Map();
        chat.sessionId = sessionId;
        chat.error = null;
        chat.streaming = false;
        chat.thinkingStart = null;
        if (directory) chat.directory = directory;
      }

      function chatSet(id, part) {
        if (!id || !part) return;
        if (!chat.raw.has(id)) chat.order.push(id);
        chat.raw.set(id, part);
      }

      function chatEntries() {
        return chat.base.concat(chat.order.map((id) => partEntry(chat.raw.get(id))).filter(Boolean));
      }

      async function api(path, init) {
        const r = await fetch(path, Object.assign({ cache: 'no-store' }, init || {}));
        let j = null;
        try { j = await r.json(); } catch { j = { ok: false, error: 'HTTP ' + r.status }; }
        if (!r.ok || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
        return j;
      }

      async function loadWorkspace() {
        try {
          const j = await api('/api/chat/workspace' + (chat.directory ? '?dir=' + encodeURIComponent(chat.directory) : ''));
          chat.workspace = j;
          chat.source = j.source;
          // An explicit pick wins over detection, but keep re-detecting so the
          // button can jump back to whatever VSCodium actually has open.
          if (!chat.directory || j.source !== 'explicit') chat.directory = j.directory;
          chat.dirs = j.candidates || [];
          paintWorkspace();
        } catch (e) {
          chat.error = 'workspace: ' + e.message;
          paintWorkspace();
        }
      }

      async function loadCatalog() {
        const sel = $('#catalogTools');
        try {
          const j = await api('/api/catalog');
          const descMap = {};
          const groups = [];
          const agents = j.agents || [];
          if (agents.length) {
            agents.forEach((a) => { descMap[a.name] = a.description; });
            groups.push({ label: 'Agents (' + agents.length + ')', items: agents.map((a) => a.name) });
          }
          const commands = j.commands || [];
          if (commands.length) {
            commands.forEach((c) => { descMap[c.name] = c.description; });
            groups.push({ label: 'Commands (' + commands.length + ')', items: commands.map((c) => c.name) });
          }
          const skills = j.skills || [];
          if (skills.length) {
            skills.forEach((s) => { descMap[s.name] = s.description; });
            groups.push({ label: 'Skills (' + skills.length + ')', items: skills.map((s) => s.name) });
          }
          const tools = j.tools || {};
          const toolNames = Object.keys(tools);
          if (toolNames.length) {
            groups.push({ label: 'Tools (' + toolNames.length + ')', items: toolNames });
            toolNames.forEach((n) => { descMap[n] = tools[n] + ' calls'; });
          }
          sel.replaceChildren(
            ...groups.map((g) => {
              const og = document.createElement('optgroup');
              og.label = g.label;
              g.items.forEach((name) => {
                const o = document.createElement('option');
                o.value = name;
                const d = descMap[name] || '';
                o.textContent = d ? name + ' — ' + d : name;
                og.appendChild(o);
              });
              return og;
            })
          );
          if (!sel.options.length) {
            const o = document.createElement('option');
            o.value = '';
            o.textContent = 'no catalog yet';
            sel.appendChild(o);
          }
        } catch (e) {
          const o = document.createElement('option');
          o.value = '';
          o.textContent = 'catalog unavailable';
          sel.appendChild(o);
        }
      }

      function paintWorkspace() {
        $('#chatWsPath').textContent = chat.directory || 'no workspace detected';
        $('#chatWsPath').title = chat.directory || '';
        const src = $('#chatWsSource');
        src.textContent = chat.workspace && chat.workspace.pinned ? 'pinned' : (chat.source || '—');
        src.className = 'badge ' + (chat.source === 'window' ? 'green' : chat.source === 'explicit' ? 'blue' : '');
        if (chat.workspace && chat.workspace.ambiguous && chat.workspace.ambiguous.length) {
          src.textContent = chat.source + ' (ambiguous)';
          src.title = 'Several workspaces share that folder name:\n' + chat.workspace.ambiguous.join('\n');
        }

        const opts = chat.dirs.slice();
        const wanted = chat.directory || '';
        if (wanted && !opts.includes(wanted)) opts.unshift(wanted);

        const chatSel = $('#chatDir');
        chatSel.replaceChildren(...opts.map((d) => {
          const o = document.createElement('option');
          o.value = d;
          o.textContent = d;
          return o;
        }));
        chatSel.value = wanted;

        const hdrSel = $('#headerDir');
        hdrSel.replaceChildren(...opts.map((d) => {
          const o = document.createElement('option');
          o.value = d;
          o.textContent = d;
          return o;
        }));
        hdrSel.value = wanted;

        const hdrSrc = $('#headerDirSource');
        hdrSrc.textContent = chat.source || '—';
        hdrSrc.className = 'badge ' + (chat.source === 'window' ? 'green' : chat.source === 'explicit' ? 'blue' : '');
      }

      async function loadModels() {
        try {
          const j = await api('/api/chat/models');
          chat.models = j.models || [];
          chat.model = j.default;
          const sel = $('#chatModel');
          const free = chat.models.filter((m) => !m.cost);
          const paid = chat.models.filter((m) => m.cost);
          const mk = (label, list) => {
            if (!list.length) return null;
            const g = document.createElement('optgroup');
            g.label = label;
            list.forEach((m) => {
              const o = document.createElement('option');
              o.value = m.ref;
              o.textContent = m.name;
              g.appendChild(o);
            });
            return g;
          };
          sel.replaceChildren(...[mk('no per-token cost', free), mk('metered', paid)].filter(Boolean));
          if (!sel.options.length) {
            // Never leave the picker blank: booting the private kilo server can
            // take a moment, and an empty select silently blocks New.
            const o = document.createElement('option');
            o.value = chat.model;
            o.textContent = chat.model;
            sel.appendChild(o);
          }
          if ([...sel.options].some((o) => o.value === chat.model)) sel.value = chat.model;
          else chat.model = sel.value;
        } catch (e) {
          chat.error = 'models: ' + e.message;
          renderChat();
        }
      }

      function closeStream() {
        if (chat.es) { chat.es.close(); chat.es = null; }
        chat.streaming = false;
        chat.thinkingStart = null;
      }

      function connectStream() {
        closeStream();
        if (!chat.sessionId) return;
        const es = new EventSource('/api/chat/events?session=' + encodeURIComponent(chat.sessionId));
        chat.es = es;

        es.onmessage = (m) => {
          let ev;
          try { ev = JSON.parse(m.data); } catch { return; }
          const p = ev.properties || {};
          switch (ev.type) {
            case 'chat.open':
              chat.directory = p.directory || chat.directory;
              chat.note = p.sessionID;
              break;
            case 'message.updated':
              if (p.info && p.info.id) chat.roles.set(p.info.id, p.info.role);
              if (p.info?.role === 'assistant') chat.streaming = true;
              break;
            case 'message.part.updated':
              chatSet(p.part && p.part.id, p.part);
              if (p.part?.type === 'tool') chat.note = p.part.tool + ':' + ((p.part.state || {}).status || '');
              break;
            case 'message.part.delta': {
              const part = chat.raw.get(p.partID);
              if (part && part.type !== 'tool') part.text = (part.text || '') + (p.delta || '');
              break;
            }
            case 'message.part.removed':
              chat.raw.delete(p.partID);
              chat.order = chat.order.filter((id) => id !== p.partID);
              break;
            case 'session.status':
              chat.note = p.status && p.status.type ? p.status.type : chat.note;
              if (p.status?.type === 'busy') {
                chat.streaming = true;
                if (!chat.thinkingStart) chat.thinkingStart = Date.now();
              }
              break;
            case 'session.error':
              chat.error = (p.error && (p.error.message || p.error.data?.message)) || 'session error';
              chat.thinkingStart = null;
              break;
            case 'session.idle':
              chat.streaming = false;
              chat.note = 'idle';
              chat.thinkingStart = null;
              break;
            default:
              break;
          }
          scheduleChatRender();
        };
        es.onerror = () => {
          // EventSource retries on its own; only surface it so a dead backend is
          // not mistaken for a quiet agent.
          if (es.readyState === EventSource.CLOSED) {
            chat.error = 'event stream closed — the chat backend may have stopped';
            chat.streaming = false;
            scheduleChatRender();
          }
        };
      }

      async function newChat() {
        closeStream();
        chat.loading = true;
        chat.directory = $('#chatDir').value || chat.directory;
        renderChat();
        try {
          const j = await api('/api/chat/session', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ directory: chat.directory, model: chat.model }),
          });
          chatReset(j.session.id, j.workspace);
          chat.note = j.session.id;
          connectStream();
        } catch (e) {
          chat.error = e.message;
          chat.sessionId = null;
        } finally {
          chat.loading = false;
          renderChat();
        }
      }

      async function attachSession(id) {
        closeStream();
        chat.loading = true;
        renderChat();
        try {
          const j = await api('/api/chat/session/' + encodeURIComponent(id));
          chatReset(id, j.directory);
          chat.base = j.log;
          chat.note = id;
          connectStream();
        } catch (e) {
          chat.error = e.message;
          chat.sessionId = null;
        } finally {
          chat.loading = false;
          renderChat();
        }
      }

      async function sendChat() {
        const box = $('#chatInput');
        const text = box.value.trim();
        if (!text || !chat.sessionId || chat.streaming) return;
        box.value = '';
        box.style.height = '';
        try {
          await api('/api/chat/send', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ session: chat.sessionId, text }),
          });
          chat.error = null;
          chat.streaming = true;
        } catch (e) {
          chat.error = e.message;
          chat.streaming = false;
          box.value = text;
        }
        flushChatRender();
      }

      async function stopChat() {
        if (!chat.sessionId) return;
        try {
          await api('/api/chat/abort', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ session: chat.sessionId }),
          });
        } catch (e) { chat.error = e.message; }
        chat.streaming = false;
        chat.thinkingStart = null;
        renderChat();
      }

      function renderChat() {
        const body = $('#chatBody');
        const entries = chatEntries();
        body.replaceChildren();

        if (chat.loading) {
          body.appendChild(el('div', 'log-empty', 'loading conversation…'));
        } else if (chat.error) {
          const b = el('div', 'log-empty', chat.error);
          b.style.color = 'var(--red)';
          body.appendChild(b);
        }
        if (!chat.sessionId && !chat.loading) {
          const hint = chat.open
            ? 'No conversation yet. Pick a folder and press New.'
            : 'Open the chat window to talk to an agent about the folder open in VSCodium.';
          body.appendChild(el('div', 'log-empty', hint));
        }
        const rows = entries.map(logRow).filter(Boolean);
        rows.forEach((r) => body.appendChild(r));
        if (rows.length) queueMicrotask(() => { body.scrollTop = body.scrollHeight; });

        if (chat.streaming && chat.thinkingStart) {
          const last = entries[entries.length - 1];
          if (last && last.k === 'reasoning') {
            const secs = Math.floor((Date.now() - chat.thinkingStart) / 1000);
            body.appendChild(el('div', 'thinking-row', 'thinking\u2026 ' + secs + 's'));
          }
        }

        const st = $('#chatState');
        st.textContent = chat.loading ? 'connecting' : chat.streaming ? 'working' : chat.sessionId ? 'ready' : 'no session';
        st.className = 'badge ' + (chat.loading || chat.streaming ? 'blue' : chat.sessionId ? 'green' : '');
        $('#chatNote').textContent = chat.note || '';
        // Booting the private kilo server can take several seconds; without
        // reflecting that here, Send silently does nothing on the first click.
        $('#chatSend').disabled = !chat.sessionId || chat.loading || chat.streaming || !$('#chatInput').value.trim();
        $('#chatNew').disabled = chat.loading;
        $('#chatStop').classList.toggle('hidden', !chat.streaming || chat.loading);
      }

      function setDock(open) {
        chat.open = open;
        document.body.classList.toggle('dock-open', open);
        const b = $('#chatToggle');
        b.setAttribute('aria-pressed', String(open));
        b.classList.toggle('on', open);
        if (open) {
          if (!chat.directory) loadWorkspace();
          if (!chat.models.length) loadModels();
          $('#chatInput').focus();
        }
        renderChat();
      }

      // ---- attach shortcuts ----
      // Reached from an agent card or session row, so a conversation can continue
      // a session the dashboard is already tracking instead of starting fresh.
      function attachButton(d) {
        const b = el('button', 'attach', 'chat');
        b.title = 'open the chat window attached to ' + (d.title || d.id);
        b.onclick = (e) => { e.stopPropagation(); setDock(true); attachSession(d.id); };
        return b;
      }

      $('#chatToggle').addEventListener('click', () => setDock(!chat.open));
      $('#chatClose').addEventListener('click', () => setDock(false));
      $('#chatWsReload').addEventListener('click', () => { chat.directory = null; loadWorkspace(); });
      $('#chatNew').addEventListener('click', newChat);
      $('#chatSend').addEventListener('click', sendChat);
      $('#chatStop').addEventListener('click', stopChat);

      $('#resetBoard').addEventListener('click', async () => {
        const ok = confirm('This clears state.json and .cache/. The board goes empty until the next collect. Continue?');
        if (!ok) return;
        const btn = $('#resetBoard');
        btn.disabled = true;
        btn.textContent = 'resetting…';
        try {
          await api('/api/reset', { method: 'POST' });
          load();
        } catch (e) {
          alert('reset failed: ' + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Reset board';
        }
      });

      $('#chatDir').addEventListener('change', (e) => {
        chat.directory = e.target.value;
        paintWorkspace();
      });

      $('#headerDir').addEventListener('change', (e) => {
        chat.directory = e.target.value;
        paintWorkspace();
      });

      const chatInput = $('#chatInput');
      chatInput.addEventListener('input', () => {
        // grow with the content, then stop — a chat box taller than the dock is
        // just a scroll hazard
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 190) + 'px';
        renderChat();
      });
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
      });

      paintAuto();
      scheduleAuto();
      load();
      loadCatalog();
    })();
  </script>
</body>

</html>
